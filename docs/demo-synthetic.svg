<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">frame2frame per-frame runtime architecture</title>
  <desc id="desc">A decoded RGB frame and its FaceObservation enter a stateful temporal subsystem. Dropout control, six-channel smoothing, and a source-order frame queue produce an aligned packet. Its pose drives head-oriented screen geometry while its frame and opacity join a prepared texture and projected quadrilateral in the renderer.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#202124"/>
    </marker>
    <style>
      .group { fill: #f5f5f2; stroke: #202124; stroke-width: 2.6; }
      .module { stroke: #202124; stroke-width: 2.3; }
      .flow { fill: none; stroke: #202124; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .bypass { fill: none; stroke: #202124; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .label { fill: #202124; font-family: Arial,Helvetica,sans-serif; font-size: 19px; font-weight: 500; text-anchor: middle; }
      .detail { fill: #3f4348; font-family: Arial,Helvetica,sans-serif; font-size: 17px; font-weight: 400; text-anchor: middle; }
      .edge { fill: #202124; font-family: Arial,Helvetica,sans-serif; font-size: 17px; font-weight: 400; }
      .heading { fill: #202124; font-family: Arial,Helvetica,sans-serif; font-size: 20px; font-weight: 500; }
    </style>
  </defs>

  <rect width="1200" height="660" fill="#ffffff"/>

  <!-- Perception -->
  <rect class="group" x="170" y="100" width="230" height="330" rx="12"/>
  <rect x="190" y="87" width="113" height="28" fill="#ffffff"/>
  <text class="heading" x="199" y="108">Perception</text>

  <rect class="module" x="205" y="150" width="160" height="70" rx="8" fill="#f4d3a7"/>
  <text class="label" x="285" y="179">Pose backend</text>
  <text class="detail" x="285" y="205">MediaPipe / adapters</text>

  <rect class="module" x="205" y="255" width="160" height="60" rx="8" fill="#f4d3a7"/>
  <text class="label" x="285" y="280">Coordinate</text>
  <text class="label" x="285" y="303">adapter</text>

  <rect class="module" x="195" y="345" width="180" height="70" rx="8" fill="#e5edf6"/>
  <text class="label" x="285" y="373">FaceObservation</text>
  <text class="detail" x="285" y="399">pose · center · size</text>

  <path class="flow" d="M285 220V255"/>
  <path class="flow" d="M285 315V345"/>

  <!-- External RGB input and decoded-frame split -->
  <rect class="module" x="18" y="151" width="115" height="68" rx="8" fill="#f3d4d7"/>
  <text class="label" x="75.5" y="181">RGB frame</text>
  <text class="detail" x="75.5" y="205">f[t]</text>
  <path class="flow" d="M133 185H205"/>
  <circle cx="155" cy="185" r="4.5" fill="#202124"/>

  <!-- Temporal coherence -->
  <rect class="group" x="430" y="45" width="320" height="575" rx="12"/>
  <rect x="449" y="32" width="203" height="28" fill="#ffffff"/>
  <text class="heading" x="458" y="53">Temporal coherence</text>

  <rect class="module" x="485" y="90" width="210" height="75" rx="8" fill="#e5edf6"/>
  <text class="label" x="590" y="120">Ready packet p[t]</text>
  <text class="detail" x="590" y="148">frame · optional pose · opacity</text>

  <rect class="module" x="500" y="195" width="180" height="62" rx="8" fill="#bfe1ec"/>
  <text class="label" x="590" y="233">Align + resolve</text>

  <rect class="module" x="455" y="300" width="155" height="78" rx="8" fill="#bfe1ec"/>
  <text class="label" x="532.5" y="328">6-channel filter</text>
  <text class="detail" x="532.5" y="353">pose + translation</text>
  <text class="detail" x="532.5" y="373">FIR / One Euro</text>

  <rect class="module" x="625" y="300" width="100" height="165" rx="8" fill="#bfe1ec"/>
  <text class="label" x="675" y="336">Frame</text>
  <text class="label" x="675" y="360">queue</text>
  <text class="detail" x="675" y="394">source</text>
  <text class="detail" x="675" y="416">order</text>
  <text class="detail" x="675" y="445">delay align</text>

  <rect class="module" x="455" y="410" width="155" height="70" rx="8" fill="#e7e9b5"/>
  <text class="label" x="532.5" y="438">Dropout control</text>
  <text class="detail" x="532.5" y="464">hold · fade · reset</text>

  <rect class="module" x="455" y="510" width="155" height="62" rx="8" fill="#e7e9b5"/>
  <text class="label" x="532.5" y="538">Observation state</text>
  <text class="detail" x="532.5" y="562">anchor · misses</text>

  <path class="flow" d="M532.5 510V480"/>
  <path class="flow" d="M532.5 410V378"/>
  <path class="flow" d="M532.5 300V257"/>
  <path class="flow" d="M675 300V275H590V257"/>
  <path class="flow" d="M590 195V165"/>

  <!-- Observation and frame inputs to temporal tracking -->
  <path class="flow" d="M375 380H415V541H455"/>
  <text class="edge" x="392" y="476">o[t]</text>

  <path class="flow" d="M155 185V590H675V465"/>
  <rect x="254" y="575" width="172" height="25" fill="#ffffff"/>
  <text class="edge" x="264" y="594">decoded frame f[t]</text>

  <text class="detail" x="590" y="605">one frame → one ordered packet</text>

  <!-- Geometry and rendering -->
  <rect class="group" x="790" y="45" width="380" height="575" rx="12"/>
  <rect x="809" y="32" width="230" height="28" fill="#ffffff"/>
  <text class="heading" x="818" y="53">Geometry &amp; rendering</text>

  <rect class="module" x="810" y="150" width="150" height="70" rx="8" fill="#d7e8d2"/>
  <text class="label" x="885" y="179">Camera-space</text>
  <text class="label" x="885" y="202">anchor</text>

  <rect class="module" x="810" y="260" width="150" height="70" rx="8" fill="#d7e8d2"/>
  <text class="label" x="885" y="289">Head-oriented</text>
  <text class="label" x="885" y="312">screen plane</text>

  <rect class="module" x="810" y="365" width="150" height="80" rx="8" fill="#d7e8d2"/>
  <text class="label" x="885" y="391">Pinhole</text>
  <text class="label" x="885" y="414">projection</text>
  <text class="detail" x="885" y="437">+ validity guards</text>

  <rect class="module" x="995" y="150" width="150" height="70" rx="8" fill="#f3d4d7"/>
  <text class="label" x="1070" y="179">Screen texture</text>
  <text class="detail" x="1070" y="205">prepared once</text>

  <rect class="module" x="995" y="370" width="150" height="70" rx="8" fill="#d9d8ec"/>
  <text class="label" x="1070" y="398">Perspective warp</text>
  <text class="detail" x="1070" y="425">subpixel quad</text>

  <rect class="module" x="995" y="470" width="150" height="70" rx="8" fill="#d9d8ec"/>
  <text class="label" x="1070" y="499">Alpha composite</text>
  <text class="detail" x="1070" y="525">frame + opacity</text>

  <rect class="module" x="995" y="555" width="150" height="55" rx="8" fill="#cbe4cd"/>
  <text class="label" x="1070" y="578">Rendered frame</text>
  <text class="detail" x="1070" y="601">y[t]</text>

  <!-- Ready packet split -->
  <path class="flow" d="M695 127.5H805"/>
  <text class="edge" x="739" y="116">p[t]</text>
  <circle cx="805" cy="127.5" r="4.5" fill="#202124"/>
  <path class="flow" d="M805 127.5H885V150"/>

  <!-- Geometry path -->
  <path class="flow" d="M885 220V260"/>
  <path class="flow" d="M885 330V370"/>
  <path class="flow" d="M960 405H995"/>
  <text class="edge" x="967" y="393">q[t]</text>

  <!-- Texture and rendering path -->
  <path class="flow" d="M1070 220V370"/>
  <path class="flow" d="M1070 440V470"/>
  <path class="flow" d="M1070 540V555"/>

  <!-- Source-frame path and faithful pass-through -->
  <path class="flow" d="M805 127.5V505H995"/>
  <rect x="834" y="486" width="151" height="25" fill="#f5f5f2"/>
  <text class="edge" x="842" y="505">frame + opacity</text>
  <path class="bypass" d="M805 505V582.5H995"/>
  <rect x="829" y="568" width="147" height="25" fill="#f5f5f2"/>
  <text class="edge" x="838" y="587">no valid overlay</text>
  <path class="flow" d="M1145 582.5H1190"/>
</svg>
