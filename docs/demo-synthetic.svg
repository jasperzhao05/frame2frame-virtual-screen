<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">frame2frame per-frame rendering pipeline</title>
  <desc id="desc">A decoded frame is estimated into a FaceObservation and paired with it during temporal alignment. The aligned pose projects a head-oriented screen plane; the aligned source frame, projected quadrilateral, and user-provided texture meet at the compositor.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="340" fill="#ffffff"/>

  <g font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">
    <text x="28" y="38" fill="#0f172a" font-size="25" font-weight="600">Per-frame rendering pipeline</text>

    <g fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5">
      <rect x="28" y="104" width="180" height="94" rx="4"/>
      <rect x="250" y="104" width="180" height="94" rx="4"/>
      <rect x="472" y="104" width="188" height="94" rx="4"/>
      <rect x="702" y="104" width="180" height="94" rx="4"/>
      <rect x="924" y="104" width="192" height="94" rx="4"/>
    </g>

    <g fill="#0f172a" font-size="19" font-weight="600">
      <text x="42" y="140">Decode frame</text>
      <text x="264" y="140">Pose estimation</text>
      <text x="486" y="140">Temporal alignment</text>
      <text x="716" y="140">Project screen plane</text>
      <text x="938" y="140">Warp + composite</text>
    </g>

    <g fill="#475569" font-size="17">
      <text x="42" y="172">video / webcam input</text>
      <text x="264" y="172" fill="#1d4ed8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="600">FaceObservation</text>
      <text x="486" y="172">smooth · hold · reset</text>
      <text x="716" y="172">pose + camera → quad</text>
      <text x="938" y="172">warp + alpha blend</text>
    </g>

    <g fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)">
      <path d="M208 151H250"/>
      <path d="M430 151H472"/>
      <path d="M660 151H702"/>
      <path d="M882 151H924"/>
      <path d="M1116 151H1128"/>
    </g>

    <g fill="#334155" font-size="17" font-weight="600" text-anchor="middle">
      <text x="1158" y="143">Output</text>
      <text x="1158" y="166">frame</text>
    </g>

    <path d="M566 198V312H978V198" fill="none" stroke="#64748b" stroke-width="1.75" marker-end="url(#arrow-muted)"/>
    <rect x="632" y="287" width="176" height="24" fill="#ffffff"/>
    <text x="720" y="305" fill="#475569" font-size="17" text-anchor="middle">aligned source frame</text>

    <rect x="702" y="236" width="180" height="48" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="792" y="266" fill="#334155" font-size="17" font-weight="500" text-anchor="middle">screen texture</text>
    <path d="M882 260H1048V198" fill="none" stroke="#64748b" stroke-width="1.75" marker-end="url(#arrow-muted)"/>
  </g>
</svg>
