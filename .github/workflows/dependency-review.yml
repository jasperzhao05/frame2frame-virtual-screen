name: dependency-review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Reject newly introduced high-risk runtime dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # GitHub's dependency graph is a deliberate prerequisite. If it is
          # unavailable, the action fails instead of silently passing the PR.
          # Keep the beta practical: block new high and critical findings
          # without making lower-severity advisories a merge gate.
          fail-on-severity: high
          fail-on-scopes: runtime
