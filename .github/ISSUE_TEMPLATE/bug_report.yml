name: Bug report
description: Report a reproducible problem in frame2frame
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Please prefer synthetic media and remove private faces, audio, paths, and metadata.
        Report security issues through the private advisory link in SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Share the exact command or a small Python snippet and synthetic inputs.
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Pose backend
      options:
        - not backend-related / unknown
        - mediapipe
        - hopenet
        - 6drepnet (experimental)
        - scripted/custom
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: frame2frame version or commit
      description: Paste `frame2frame --version`, or provide the exact commit SHA for a source checkout.
      placeholder: "frame2frame X.Y.Z or commit SHA"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, `python -VV`, OpenCV, MediaPipe, and optional backend versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove private faces, audio, local path names, credentials, and unrelated metadata.
      render: text
