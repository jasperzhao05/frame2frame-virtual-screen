version: 2

updates:
  # Workflow actions are immutable SHA pins. Dependabot keeps those pins on
  # reviewed upstream releases without making runtime dependency noise.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"

  # Runtime constraints are deliberately broad and CI already resolves their
  # newest compatible versions. Suppress routine lower-bound churn while still
  # allowing GitHub's security-update service to raise patched constraints.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 0
    groups:
      python-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
